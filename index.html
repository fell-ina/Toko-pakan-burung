<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milky Wave POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/esc-pos-encoder@2.1.0/dist/esc-pos-encoder.browser.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 transition-colors duration-300" id="appBody">

    <nav class="bg-white dark:bg-slate-800 shadow-md sticky top-0 z-50 border-b dark:border-slate-700">
        <div class="flex justify-around items-center max-w-5xl mx-auto">
            <button onclick="openTab('tab-print')" id="btn-tab-print" class="tab-btn active-tab">🖨️ Kasir</button>
            <button onclick="openTab('tab-menu')" id="btn-tab-menu" class="tab-btn">📂 Menu</button>
            <button onclick="openTab('tab-history')" id="btn-tab-history" class="tab-btn">📜 History</button>
            <button onclick="openTab('tab-profil')" id="btn-tab-profil" class="tab-btn">⚙️ Setting</button>
        </div>
    </nav>

    <div id="bt-status" class="bg-amber-100 text-amber-800 text-[10px] text-center py-1 font-bold">
        Printer Belum Terhubung. Silakan ke menu Setting.
    </div>

    <main class="max-w-5xl mx-auto p-4 pb-24">
        
        <div id="tab-print" class="tab-content active">
            <div class="flex flex-col lg:flex-row gap-6">
                <div class="flex-1">
                    <div id="category-chips" class="flex gap-2 overflow-x-auto mb-4 pb-2"></div>
                    <div id="grid-etalase" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-lg border dark:border-slate-700 h-fit lg:w-80 sticky top-24">
                    <h3 class="font-bold border-b dark:border-slate-700 pb-2 mb-3 dark:text-white">Pesanan</h3>
                    <div id="cart-items" class="space-y-2 mb-4 max-h-60 overflow-y-auto"></div>
                    <div class="border-t dark:border-slate-700 pt-3">
                        <div class="flex justify-between font-black text-xl mb-4 dark:text-white">
                            <span>Total</span>
                            <span id="total-cart">Rp 0</span>
                        </div>
                        <button onclick="prosesCheckout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-lg transition transform active:scale-95">CETAK NOTA</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-menu" class="tab-content">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border dark:border-slate-700 mb-8">
                <h3 id="form-title" class="font-bold text-lg mb-4 text-blue-600">Tambah Item Baru</h3>
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="inp-nama" placeholder="Nama Barang" class="input-style">
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <span class="absolute left-3 top-3 text-gray-400">Rp</span>
                            <input type="number" id="inp-harga" placeholder="Harga" class="input-style pl-10">
                        </div>
                        <select id="inp-satuan" class="input-style w-24">
                            <option value="pcs">pcs</option>
                            <option value="gr">gr</option>
                            <option value="ons">ons</option>
                            <option value="kg">kg</option>
                        </select>
                    </div>
                    <input type="text" id="inp-kategori" list="list-kat" placeholder="Kategori (Minuman/Makanan)" class="input-style">
                    <datalist id="list-kat"></datalist>
                    <input type="file" id="inp-foto" class="text-xs text-gray-400">
                    <div class="flex gap-2 md:col-span-2">
                        <button id="btn-simpan" onclick="simpanBarang()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">SIMPAN</button>
                        <button id="btn-batal" onclick="resetFormMenu()" class="hidden bg-gray-500 text-white px-6 py-3 rounded-xl font-bold">BATAL</button>
                    </div>
                </div>
            </div>
            <div id="menu-grouped-list" class="space-y-6"></div>
        </div>

        <div id="tab-history" class="tab-content">
            <h2 class="text-xl font-bold mb-4 dark:text-white">Riwayat Penjualan</h2>
            <div id="history-list" class="space-y-3"></div>
            <button onclick="resetHistory()" class="mt-10 text-red-500 text-xs underline">Hapus Permanen Semua History</button>
        </div>

        <div id="tab-profil" class="tab-content text-center py-6">
            <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border dark:border-slate-700 max-w-sm mx-auto">
                <h2 class="text-2xl font-black text-blue-600 mb-6">PENGATURAN</h2>
                <button onclick="hubungkanBluetooth()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold mb-4 flex items-center justify-center gap-2">
                    <span>🔗</span> HUBUNGKAN BLUETOOTH
                </button>
                <div class="flex gap-2 mb-6">
                    <button onclick="gantiTema('light')" class="flex-1 border p-3 rounded-xl dark:text-white">☀️ Light</button>
                    <button onclick="gantiTema('dark')" class="flex-1 border bg-slate-900 text-white p-3 rounded-xl">🌙 Dark</button>
                </div>
                <p class="text-[10px] text-gray-400">Versi 3.0 Build 2026 - Felix Dev</p>
            </div>
        </div>
    </main>

    <div id="modal-history" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-xs rounded-2xl p-6">
            <h3 class="font-bold text-lg mb-2 dark:text-white text-center">Detail Nota</h3>
            <div id="modal-body" class="space-y-2 text-sm border-y dark:border-slate-700 py-4 my-4 max-h-60 overflow-y-auto"></div>
            <div class="flex justify-between font-black text-blue-600 text-lg mb-6">
                <span>TOTAL</span><span id="modal-total"></span>
            </div>
            <button onclick="tutupModal()" class="w-full bg-slate-100 dark:bg-slate-700 py-3 rounded-xl font-bold dark:text-white">Tutup</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEMBANG ARUM POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-20">

    <header class="bg-white p-4 sticky top-0 shadow-sm z-10">
        <h1 class="text-center text-blue-700 font-black text-xl tracking-tight">KEMBANG ARUM POS</h1>
    </header>

    <main id="tab-kasir" class="p-4 space-y-4">
        <input type="text" id="search-kasir" onkeyup="filterProduk('kasir')" placeholder="🔍 Cari pakan..." 
               class="w-full p-4 rounded-2xl border-none bg-white shadow-md focus:ring-2 focus:ring-blue-500">
        <div id="produk-list" class="grid grid-cols-2 gap-3"></div>
    </main>

    <main id="tab-produk" class="hidden p-4 space-y-4">
        <div class="bg-white p-5 rounded-3xl shadow-lg space-y-3">
            <h2 class="font-bold text-lg">Tambah Produk Baru</h2>
            <input type="text" id="p-nama" placeholder="Nama Produk" class="w-full p-3 bg-slate-100 rounded-xl border-none">
            <input type="number" id="p-harga" placeholder="Harga (Rp)" class="w-full p-3 bg-slate-100 rounded-xl border-none">
            <button onclick="tambahProdukBaru()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 active:scale-95 transition">SIMPAN KE KATALOG</button>
        </div>
        <hr class="my-4 border-slate-200">
        <input type="text" id="search-produk" onkeyup="filterProduk('produk')" placeholder="🔍 Cari di gudang..." 
               class="w-full p-4 rounded-2xl border-none bg-white shadow-md focus:ring-2 focus:ring-blue-500">
        <div id="master-produk-list" class="space-y-3"></div>
    </main>

    <main id="tab-riwayat" class="hidden p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-lg">📜 Riwayat Penjualan</h2>
            <button onclick="hapusSemuaRiwayat()" class="text-red-500 text-sm font-bold">Hapus Semua</button>
        </div>
        <div id="history-list" class="space-y-3"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-lg border-t flex justify-around p-3 shadow-2xl">
        <button onclick="switchTab('kasir')" class="flex flex-col items-center text-blue-600">
            <span class="text-xl">🛒</span><span class="text-[10px] font-bold">KASIR</span>
        </button>
        <button onclick="switchTab('produk')" class="flex flex-col items-center text-slate-400">
            <span class="text-xl">📦</span><span class="text-[10px] font-bold">PRODUK</span>
        </button>
        <button onclick="switchTab('riwayat')" class="flex flex-col items-center text-slate-400">
            <span class="text-xl">📜</span><span class="text-[10px] font-bold">RIWAYAT</span>
        </button>
    </nav>

    <div id="cart-drawer" class="fixed bottom-20 left-4 right-4 bg-blue-900 text-white p-5 rounded-3xl shadow-2xl hidden">
        <div class="flex justify-between items-center mb-4">
            <span class="font-black">TOTAL: Rp <span id="cart-total">0</span></span>
            <button onclick="prosesCheckout()" class="bg-white text-blue-900 px-6 py-2 rounded-full font-black">CETAK NOTA</button>
        </div>
        <div id="cart-items" class="text-xs space-y-2 opacity-80 max-h-32 overflow-y-auto"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

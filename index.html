<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir TOKO PAKAN KEMBANG ARUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light" id="appBody">

    <nav class="nav-bar shadow-md sticky top-0 z-50">
        <div class="flex justify-around">
            <button onclick="openTab('tab-print')" id="btn-tab-print" class="tab-btn active-tab">🖨️ Print</button>
            <button onclick="openTab('tab-menu')" id="btn-tab-menu" class="tab-btn">📂 Menu</button>
            <button onclick="openTab('tab-history')" id="btn-tab-history" class="tab-btn">📜 History</button>
            <button onclick="openTab('tab-profil')" id="btn-tab-profil" class="tab-btn">👤 Profil</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 pb-24">
        
        <div id="tab-print" class="tab-content active">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex-1">
                    <div id="category-chips" class="flex gap-2 overflow-x-auto mb-4 pb-2"></div>
                    <div id="grid-etalase" class="grid grid-cols-2 lg:grid-cols-3 gap-3"></div>
                </div>
                <div class="cart-panel p-4 rounded-xl shadow-lg border h-fit md:w-80">
                    <h3 class="font-bold border-b pb-2 mb-3">Pesanan Baru</h3>
                    <div id="cart-items" class="space-y-3 mb-4 max-h-80 overflow-y-auto"></div>
                    <div class="border-t pt-3">
                        <div class="flex justify-between font-bold text-xl mb-4">
                            <span>Total</span>
                            <span id="total-cart">Rp 0</span>
                        </div>
                        <button onclick="checkout()" class="btn-primary w-full py-4 rounded-xl font-bold shadow-lg">CETAK NOTA</button>
                    </div>
                </div>
            </div>
        </div>

      <div id="tab-menu" class="tab-content">
    <div class="form-container p-6 rounded-xl shadow-sm mb-6 border border-blue-100 dark:border-slate-700 bg-white dark:bg-slate-800">
        <h3 id="form-title" class="font-bold text-lg mb-4 text-blue-600">Tambah Item Baru</h3>
        <input type="hidden" id="edit-id"> <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="inp-nama" placeholder="Nama Barang" class="input-field">
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <span class="absolute left-3 top-3 text-gray-400">Rp</span>
                    <input type="number" id="inp-harga" placeholder="Harga" class="input-field pl-10">
                </div>
                <select id="inp-satuan" class="input-field w-24">
                    <option value="pcs">pcs</option>
                    <option value="gr">gr</option>
                    <option value="ons">ons</option>
                    <option value="kg">kg</option>
                </select>
            </div>
            <input type="text" id="inp-kategori" list="list-kat" placeholder="Kategori (Kosongkan jika tidak ada)" class="input-field">
            <datalist id="list-kat"></datalist>
            <input type="file" id="inp-foto" class="text-sm mt-1 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            
            <div class="flex gap-2 md:col-span-2">
                <button id="btn-simpan" onclick="addItem()" class="btn-add flex-1 py-3 rounded-lg font-bold">SIMPAN BARANG</button>
                <button id="btn-batal" onclick="resetForm()" class="hidden bg-gray-500 text-white px-6 py-3 rounded-lg font-bold">BATAL</button>
            </div>
        </div>
    </div>

    <div id="menu-grouped-list" class="space-y-8">
        </div>
</div>
                    <select id="inp-satuan" class="input-field">
                        <option value="pcs">pcs</option>
                        <option value="gr">gr</option>
                        <option value="ons">ons</option>
                        <option value="kg">kg</option>
                    </select>
                    <input type="text" id="inp-kategori" list="list-kat" placeholder="Kategori (Cth: Minuman)" class="input-field">
                    <datalist id="list-kat"></datalist>
                    <input type="file" id="inp-foto" class="text-sm mt-2">
                    <button onclick="addItem()" class="btn-add md:col-span-2 py-3 rounded-lg font-bold">SIMPAN BARANG</button>
                </div>
            </div>
            <div id="table-view" class="overflow-x-auto rounded-xl border">
                <table class="w-full text-left bg-white dark-table">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-4">Item</th>
                            <th class="p-4">Kategori</th>
                            <th class="p-4">Harga</th>
                            <th class="p-4">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="menu-items-table"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-history" class="tab-content">
            <h2 class="text-2xl font-bold mb-6">Catatan Penjualan Lengkap</h2>
            <div id="history-detail-list" class="space-y-4"></div>
            <button onclick="clearHistory()" class="mt-10 text-red-500 underline text-sm">Reset History</button>
        </div>

        <div id="tab-profil" class="tab-content text-center py-10">
            <div class="card p-10 rounded-3xl shadow-xl border inline-block w-full max-w-md">
                <h2 class="text-3xl font-black mb-2 text-blue-600">PAKAN BURUNG KEMBANG ARUM</h2>
                <p class="text-gray-500 mb-8">System Ready for VSC TM-58V</p>
                <div class="flex flex-col gap-4">
                    <button onclick="setTheme('light')" class="theme-btn light-btn">☀️ Mode Terang (Light)</button>
                    <button onclick="setTheme('dark')" class="theme-btn dark-btn">🌙 Mode Gelap (Dark)</button>
                </div>
            </div>
        </div>
    </main>

    <div id="area-nota" class="hidden-print">
        <center>
            <h3 style="margin:0">TOKO PAKAN BURUNG KEMBANG ARUM</h3>
            <p style="font-size:10px; margin:0">Nota Penjualan</p>
            <p>-------------------------</p>
        </center>
        <div id="nota-items-list"></div>
        <p>-------------------------</p>
        <div id="nota-total-price" style="font-weight:bold; display:flex; justify-content:space-between"></div>
        <center><p style="margin-top:20px; font-size:10px">Terima Kasih</p></center>
    </div>
<div id="modal-history" class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all">
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold dark:text-white">Detail Transaksi</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl">&times;</button>
            </div>
            <div id="modal-content-detail" class="space-y-4">
                </div>
            <div class="mt-6 pt-4 border-t border-dashed border-gray-300 dark:border-slate-600">
                <div class="flex justify-between font-black text-xl text-blue-600">
                    <span>TOTAL</span>
                    <span id="modal-total-akhir"></span>
                </div>
            </div>
            <button onclick="closeModal()" class="w-full mt-6 bg-gray-100 dark:bg-slate-700 dark:text-white py-3 rounded-xl font-bold">Tutup</button>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>

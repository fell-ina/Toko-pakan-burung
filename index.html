<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milky Wave POS - WiFi & BT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/esc-pos-encoder@2.1.0/dist/esc-pos-encoder.browser.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 transition-colors duration-300" id="appBody">

    <nav class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-50 border-b dark:border-slate-700">
        <div class="flex justify-around items-center max-w-5xl mx-auto text-[11px] font-bold uppercase tracking-wider">
            <button onclick="openTab('tab-print')" id="btn-tab-print" class="tab-btn active-tab py-4 px-2">🛒 Kasir</button>
            <button onclick="openTab('tab-menu')" id="btn-tab-menu" class="tab-btn py-4 px-2">📦 Produk</button>
            <button onclick="openTab('tab-history')" id="btn-tab-history" class="tab-btn py-4 px-2">📜 Riwayat</button>
            <button onclick="openTab('tab-profil')" id="btn-tab-profil" class="tab-btn py-4 px-2">⚙️ Setup</button>
        </div>
    </nav>

    <div id="conn-status" class="bg-slate-200 text-slate-600 text-[10px] text-center py-1 font-bold">
        Printer Status: Offline
    </div>

    <main class="max-w-5xl mx-auto p-4 pb-24">
        
        <div id="tab-print" class="tab-content active">
            <div class="flex flex-col lg:flex-row gap-6">
                <div class="flex-1">
                    <div id="category-chips" class="flex gap-2 overflow-x-auto mb-4 pb-2 no-scrollbar"></div>
                    <div id="grid-etalase" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-xl border dark:border-slate-700 h-fit lg:w-80 sticky top-24">
                    <h3 class="font-black text-sm mb-4 dark:text-white uppercase tracking-widest">Order List</h3>
                    <div id="cart-items" class="space-y-2 mb-6 max-h-64 overflow-y-auto pr-2"></div>
                    <div class="border-t-2 border-dashed dark:border-slate-700 pt-4">
                        <div class="flex justify-between font-black text-2xl mb-5 dark:text-white">
                            <span class="text-xs self-center text-slate-400">TOTAL</span>
                            <span id="total-cart">Rp 0</span>
                        </div>
                        <button onclick="prosesCheckout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black shadow-lg transition active:scale-95">CETAK NOTA</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-menu" class="tab-content">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border dark:border-slate-700 mb-8">
                <h3 id="form-title" class="font-black text-blue-600 mb-4 uppercase">Kelola Barang</h3>
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="inp-nama" placeholder="Nama Produk" class="input-style">
                    <input type="number" id="inp-harga" placeholder="Harga Jual" class="input-style">
                    <input type="text" id="inp-kategori" list="list-kat" placeholder="Kategori" class="input-style">
                    <datalist id="list-kat"></datalist>
                    <input type="file" id="inp-foto" class="text-xs text-slate-400 p-2">
                    <div class="flex gap-2 md:col-span-2">
                        <button id="btn-simpan" onclick="simpanBarang()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">SIMPAN</button>
                        <button id="btn-batal" onclick="resetFormMenu()" class="hidden bg-slate-400 text-white px-6 py-3 rounded-xl font-bold">BATAL</button>
                    </div>
                </div>
            </div>
            <div id="menu-grouped-list" class="space-y-6"></div>
        </div>

        <div id="tab-history" class="tab-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black dark:text-white uppercase">Riwayat</h2>
                <button onclick="resetHistory()" class="text-[10px] bg-red-50 text-red-500 px-3 py-1 rounded-full border border-red-100">Bersihkan Semua</button>
            </div>
            <div id="history-list" class="space-y-3"></div>
        </div>

        <div id="tab-profil" class="tab-content text-center py-6">
            <div class="bg-white dark:bg-slate-800 p-8 rounded-[2rem] shadow-2xl border dark:border-slate-700 max-w-sm mx-auto">
                <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🖨️</div>
                <h2 class="text-xl font-black mb-2 dark:text-white uppercase">Konfigurasi Printer</h2>
                <p class="text-xs text-slate-400 mb-8">Pilih salah satu metode koneksi di bawah ini untuk mencetak nota.</p>
                
                <button onclick="hubungkanBluetooth()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold mb-3 flex items-center justify-center gap-3">
                    <span>🔵</span> Bluetooth Connect
                </button>
                
                <div class="my-6 border-t dark:border-slate-700 relative">
                    <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 px-4 text-[10px] text-slate-400 font-bold">ATAU VIA WIFI</span>
                </div>

                <div class="space-y-3">
                    <input type="text" id="ip-printer" placeholder="IP: 192.168.1.100" class="input-style text-center font-mono">
                    <p class="text-[9px] text-slate-400">Pastikan IP printer sudah statis.</p>
                </div>

                <div class="flex gap-2 mt-10">
                    <button onclick="gantiTema('light')" class="flex-1 border p-3 rounded-xl dark:text-white text-xs font-bold">Terang</button>
                    <button onclick="gantiTema('dark')" class="flex-1 border bg-slate-900 text-white p-3 rounded-xl text-xs font-bold">Gelap</button>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-history" class="fixed inset-0 bg-slate-900/80 z-[100] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-800 w-full max-w-xs rounded-[2rem] p-8 shadow-2xl">
            <div id="modal-body" class="space-y-3 text-xs border-y dark:border-slate-700 py-6 my-6 font-mono"></div>
            <div class="flex justify-between font-black text-blue-600 text-xl mb-8">
                <span class="text-[10px] self-center text-slate-400">TOTAL</span>
                <span id="modal-total"></span>
            </div>
            <button onclick="tutupModal()" class="w-full bg-slate-100 dark:bg-slate-700 py-4 rounded-2xl font-black dark:text-white uppercase tracking-widest text-xs">Tutup</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kembang Arum POS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-24">

    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-black italic tracking-tighter">KEMBANG ARUM <span class="text-blue-500">POS</span></h1>
    </header>

    <div id="kasir" class="tab-content active p-4">
        <input type="text" id="search-kasir" onkeyup="filterTampilan('kasir')" placeholder="Cari pakan..." class="search-input">
        
        <div id="produk-list" class="grid-produk mb-4"></div>

        <div class="card-keranjang">
            <h2 class="label-keranjang">Keranjang Belanja</h2>
            <div id="cart-items" class="space-y-3 mb-4"></div>
            <div class="flex justify-between items-center border-t pt-4">
                <span class="total-label">TOTAL</span>
                <span id="cart-total" class="total-amount">Rp 0</span>
            </div>
            <button onclick="prosesCheckout()" class="btn-cetak">
                <i class="fa-solid fa-print mr-2"></i> Cetak Nota
            </button>
        </div>
    </div>

    <div id="produk" class="tab-content p-4">
        <div class="form-container">
            <h2 class="font-bold mb-4">Tambah Produk Baru</h2>
            <input type="text" id="p-nama" placeholder="Nama Produk" class="input-field">
            <input type="number" id="p-harga" placeholder="Harga (Rp)" class="input-field">
            <button onclick="simpanProdukBaru()" class="btn-simpan">Simpan ke Katalog</button>
        </div>

        <input type="text" id="search-produk" onkeyup="filterTampilan('produk')" placeholder="Cari di gudang..." class="search-input">
        <div id="master-produk-list" class="space-y-2"></div>
    </div>

    <div id="riwayat" class="tab-content p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-slate-800 text-lg">Riwayat Penjualan</h2>
            <button onclick="hapusSemuaRiwayat()" class="btn-reset">Hapus Semua</button>
        </div>
        <div id="history-list" class="space-y-3"></div>
    </div>

    <nav class="bottom-nav">
        <button onclick="switchTab('kasir')" id="nav-kasir" class="nav-item active">
            <i class="fa-solid fa-cash-register text-xl"></i><span class="nav-text">Kasir</span>
        </button>
        <button onclick="switchTab('produk')" id="nav-produk" class="nav-item">
            <i class="fa-solid fa-box text-xl"></i><span class="nav-text">Produk</span>
        </button>
        <button onclick="switchTab('riwayat')" id="nav-riwayat" class="nav-item">
            <i class="fa-solid fa-scroll text-xl"></i><span class="nav-text">Riwayat</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
